name: "ghav human: Quality assurance"
"on":
  push:
    branches:
      - ghav/dev/18428
    paths:
      - .ghav/human
permissions: {}
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TURBO_CACHE: remote:rw
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout repo
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - name: Setup pnpm and Node.js
        uses: ./.github/actions/setup-pnpm-node
      - name: Run lint and format checks
        run: pnpm lint
