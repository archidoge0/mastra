name: "ghav before: Publish to npm"
permissions:
  contents: write
  pull-requests: write
"on":
  push:
    branches:
      - ghav/dev/22380
    paths:
      - .ghav/before
jobs:
  stable:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Initial checkout
        uses: actions/checkout@e8d4307400f9427dba7cb98e488d6ab85f1cec5f
        timeout-minutes: 20
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.ref }}
      - name: "ghav: configure git identity (replaces Dane App Auth)"
        run: |-
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Re-checkout with app token
        uses: actions/checkout@e8d4307400f9427dba7cb98e488d6ab85f1cec5f
        timeout-minutes: 20
        with:
          token: ${{ github.token }}
          fetch-depth: 0
          persist-credentials: true
          ref: ${{ github.ref }}
      - name: Check for pre.json file existence
        id: check_files
        shell: bash
        run: |
          git fetch origin "$GITHUB_REF_NAME"
          git merge --ff-only "origin/$GITHUB_REF_NAME"

          if [[ -f .changeset/pre.json ]]; then
            echo "files_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "files_exists=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        name: Install pnpm
        with:
          run_install: false
      - name: Setup Node.js 24.x
        uses: actions/setup-node@04be95cf3511ea51ebf9f224ddfb99cc7ab87cd4
        with:
          node-version: 24.18.0
          registry-url: https://registry.npmjs.org
          cache: pnpm
          package-manager-cache: false
      - name: Ensure npm 11.5.1+ for OIDC
        run: npm install -g npm@latest
      - name: Install dependencies
        run: pnpm install
      - name: Build packages
        run: pnpm build
      - name: Exit prerelease mode
        if: steps.check_files.outputs.files_exists == 'true'
        run: |
          pnpm changeset-cli pre exit
          pnpm changeset-cli version
          git add -A
          git commit -m 'chore: version - exit prerelease mode' --no-verify
          pnpm install
          pnpm build
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Get CLI version
        id: cli-version
        run: |
          version=$(node -p 'require("./packages/cli/package.json").version')
          echo "version=$version" >> "$GITHUB_OUTPUT"
    timeout-minutes: 90
