name: "ghav before: Vitest Changed Tests"
"on":
  push:
    branches:
      - ghav/dev/12662
    paths:
      - .ghav/before
permissions: {}
jobs:
  test:
    name: Test (Shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard:
          - 1
          - 2
          - 3
          - 4
    env:
      TURBO_CACHE: remote:r
    permissions:
      contents: read
    steps:
      - name: Checkout PR code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Checkout trusted actions from base branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          sparse-checkout: .github/actions
          path: trusted-actions
      - name: Use trusted actions
        run: |
          rm -rf .github/actions
          cp -r trusted-actions/.github/actions .github/actions
      - id: pr-info
        name: "ghav: folded outputs of Get PR base branch"
        run: echo "base_ref=main" >> "$GITHUB_OUTPUT"
      - name: Setup pnpm and Node.js
        uses: ./.github/actions/setup-pnpm-node
      - name: Build packages
        run: pnpm turbo build --filter "!./examples/**/*" --filter "!./docs/" --filter "!./explorations/**/*"
        env:
          NODE_OPTIONS: --max_old_space_size=6144
      - name: Run changed tests (Shard ${{ matrix.shard }}/4)
        run: |
          pnpm vitest run \
            --changed origin/${{ steps.pr-info.outputs.base_ref }} \
            --reporter=blob \
            --outputFile.blob=.vitest-reports/blob-${{ matrix.shard }}.json \
            --shard=${{ matrix.shard }}/4 \
            --passWithNoTests
        env:
          NODE_OPTIONS: --max_old_space_size=6144
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-blob-${{ matrix.shard }}
          path: .vitest-reports/
          include-hidden-files: true
          retention-days: 1
  merge-reports:
    name: Merge Test Reports
    runs-on: ubuntu-latest
    needs: test
    if: always()
    permissions:
      contents: read
    steps:
      - name: Checkout PR code
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - name: Checkout trusted actions from base branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          sparse-checkout: .github/actions
          path: trusted-actions
      - name: Use trusted actions
        run: |
          rm -rf .github/actions
          cp -r trusted-actions/.github/actions .github/actions
      - name: Setup pnpm and Node.js
        uses: ./.github/actions/setup-pnpm-node
      - name: Download all test results
        uses: actions/download-artifact@v4
        with:
          pattern: vitest-blob-*
          path: .vitest-reports
          merge-multiple: true
      - name: Merge reports
        run: pnpm vitest --merge-reports --reporter=default --reporter=github-actions --passWithNoTests
